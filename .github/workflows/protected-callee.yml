name: Protected Reusable Callee

on:
  workflow_dispatch:
    inputs:
      transitive_marker:
        description: Create the fixed marker only in the transitive arm
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      transitive_marker:
        required: true
        type: boolean

permissions:
  contents: write

jobs:
  protected:
    runs-on: ubuntu-latest
    environment: protected-callee
    steps:
      - name: Verify protected authority and bounded marker
        env:
          BB_CANARY: ${{ secrets.BB_WORKFLOW_CALL_REPO_CANARY }}
          EXPECTED_DIGEST: 28ccb9829c15ca871b509bdf3d71753c8dc656ce484c8700df708e64aa6aeb4c
          GH_TOKEN: ${{ github.token }}
          TRANSITIVE_MARKER: ${{ inputs.transitive_marker }}
        run: |
          set -euo pipefail
          actual_digest="$(printf '%s' "$BB_CANARY" | sha256sum | awk '{print $1}')"
          test "$actual_digest" = "$EXPECTED_DIGEST"
          printf 'secret_match=true\n' >> "$GITHUB_STEP_SUMMARY"
          if [[ "$TRANSITIVE_MARKER" == "true" ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref='refs/tags/workflow-call-actor-hit-20260918-7005' \
              -f sha="$GITHUB_SHA" >/dev/null
          fi
